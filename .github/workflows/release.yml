name: Release

# Trigger: push a version tag  →  git tag v0.1.0-5 && git push origin v0.1.0-5
# Or run manually from the Actions tab (workflow_dispatch).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0-5)'
        required: true
        type: string
      arch_only:
        description: 'Skip the Linux/Windows/macOS matrix and only (re)build the Arch package for an existing release'
        required: false
        type: boolean
        default: false

jobs:
  release:
    if: ${{ !inputs.arch_only }}
    permissions:
      contents: write   # required to create the GitHub Release and upload assets

    strategy:
      fail-fast: false  # if one platform fails, the others keep running
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
          # One universal .app / .dmg (Apple Silicon + Intel) instead of an
          # arm64-only build: macos-latest runners are arm64.
          - platform: macos-latest
            args: '--target universal-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      # ── Source ───────────────────────────────────────────────────────────────
      # A manual run must build the requested tag, not the branch it was
      # started from (otherwise the release gets binaries of another commit).
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # The tag must match the app version, or the installers would carry a
      # different version number than the release they are attached to.
      - name: Check tag matches app version
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          WANT="${TAG#v}"
          CARGO=$(sed -n 's/^version *= *"\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          CONF=$(sed -n 's/.*"version" *: *"\(.*\)".*/\1/p' src-tauri/tauri.conf.json | head -1)
          echo "tag=$WANT  Cargo.toml=$CARGO  tauri.conf.json=$CONF"
          [ "$CARGO" = "$WANT" ] && [ "$CONF" = "$WANT" ] || { echo "::error::version mismatch"; exit 1; }

      # ── Rust ─────────────────────────────────────────────────────────────────
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Both macOS architectures are needed for the universal build.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # ── Node.js ──────────────────────────────────────────────────────────────
      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── Platform system dependencies ──────────────────────────────────────
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      # ── Sidecar binaries ──────────────────────────────────────────────────
      # Downloads bartleby-ffmpeg and bartleby-mediainfo from the sidecars-ffmpeg-9.0.2-mediainfo-26.10
      # GitHub Release into src-tauri/binaries/.
      # On macOS both arch variants are downloaded (universal binary build).
      - name: Download sidecar binaries (Linux / macOS)
        if: runner.os != 'Windows'
        run: bash scripts/download_sidecars.sh

      # A universal Tauri build looks for sidecars named
      # *-universal-apple-darwin: merge the two architectures with lipo
      # (a binary that is already universal is copied as is).
      - name: Universal macOS sidecars
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd src-tauri/binaries
          for tool in bartleby-ffmpeg bartleby-mediainfo; do
            arm="$tool-aarch64-apple-darwin"; x86="$tool-x86_64-apple-darwin"
            out="$tool-universal-apple-darwin"
            archs=$(lipo -archs "$arm")
            if [[ "$archs" == *x86_64* && "$archs" == *arm64* ]]; then
              cp "$arm" "$out"
            else
              lipo -create -output "$out" "$x86" "$arm"
            fi
            chmod +x "$out"
            echo "$out: $(lipo -archs "$out")"
            lipo -archs "$out" | grep -q x86_64 && lipo -archs "$out" | grep -q arm64 \
              || { echo "::error::$out is not universal"; exit 1; }
          done

      - name: Download sidecar binaries (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass
          .\scripts\download_sidecars.ps1

      # Prints the version of the sidecars built into this release, so that a
      # stale or mismatched binary shows up in the CI log (expected: FFmpeg 9.0.2,
      # MediaInfoLib 26.10 on every platform).
      - name: Verify sidecar binaries
        shell: bash
        run: |
          ls -lh src-tauri/binaries/
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64)   T=x86_64-unknown-linux-gnu; X= ;;
            macOS-ARM64) T=aarch64-apple-darwin;     X= ;;
            macOS-X64)   T=x86_64-apple-darwin;      X= ;;
            Windows-X64) T=x86_64-pc-windows-msvc;   X=.exe ;;
            *) echo "::error::unsupported runner $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
          esac
          FF=$(src-tauri/binaries/bartleby-ffmpeg-$T$X -hide_banner -version | head -1)
          MI=$(src-tauri/binaries/bartleby-mediainfo-$T$X --version | tail -1)
          echo "$FF"; echo "$MI"
          # Fail on a stale or wrong binary instead of only printing it.
          echo "$FF" | grep -q "version 9\.0\.2" || { echo "::error::unexpected ffmpeg version"; exit 1; }
          echo "$MI" | grep -q "v26\.10"         || { echo "::error::unexpected MediaInfo version"; exit 1; }

      # ── npm ───────────────────────────────────────────────────────────────
      - name: npm install
        run: npm install

      # ── Build & publish ───────────────────────────────────────────────────
      # tauri-action builds the platform installer, creates a GitHub Release
      # (draft) and uploads the artifacts.
      #
      # ⚠  macOS: the .dmg is not notarized (no Apple Developer account).
      #    Distributed via Homebrew cask which strips the quarantine flag.
      # ⚠  Windows: the installer is unsigned → SmartScreen warning on first run.
      - name: Build & publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName:      ${{ github.event.inputs.tag || github.ref_name }}
          releaseName:  'Bartleby ${{ github.event.inputs.tag || github.ref_name }}'
          releaseDraft: true
          prerelease:   false
          args:         ${{ matrix.args }}

  # Arch Linux / pacman package. Built separately from the tauri-action matrix
  # above because it needs to run inside an Arch container to produce a native
  # .pkg.tar.zst — see packaging/arch/PKGBUILD for how the build works.
  # `needs: release` so the GitHub Release (created by the job above) already
  # exists by the time we upload to it; `if: always()` so a Windows/macOS
  # failure in the matrix (fail-fast: false), or a skipped release job
  # (arch_only run), doesn't block this job.
  arch-package:
    needs: release
    if: always()
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    permissions:
      contents: write

    steps:
      - name: Install system dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            git rust nodejs npm webkit2gtk-4.1 gtk3 librsvg patchelf github-cli

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download sidecar binaries
        run: bash scripts/download_sidecars.sh

      # The tag goes through an environment variable, never interpolated
      # into the script text (a crafted manual input could inject commands).
      - name: Resolve package version
        id: ver
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          RAW="${TAG#v}"
          echo "pkgver=${RAW//-/.}" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set PKGBUILD version
        env:
          PKGVER: ${{ steps.ver.outputs.pkgver }}
        run: |
          case "$PKGVER" in *[!0-9.]*|"") echo "::error::bad version '$PKGVER'"; exit 1 ;; esac
          sed -i "s/^pkgver=.*/pkgver=$PKGVER/" packaging/arch/PKGBUILD

      # makepkg refuses to run as root, so build as an unprivileged user.
      # `su - builder` (with the dash) resets $HOME to /home/builder — without
      # it, $HOME stays /root, which builder can't write to, and cargo/npm
      # fail trying to create their cache dirs there.
      - name: Build package
        run: |
          useradd -m builder
          chown -R builder:builder .
          su - builder -c "cd '$GITHUB_WORKSPACE/packaging/arch' && makepkg -f --noconfirm"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKGVER:   ${{ steps.ver.outputs.pkgver }}
          TAG:      ${{ steps.ver.outputs.tag }}
          REPO:     ${{ github.repository }}
        run: |
          pkg=$(find packaging/arch -maxdepth 1 -name '*.pkg.tar.zst' -print -quit)
          asset="Bartleby_${PKGVER}_x86_64.pkg.tar.zst"
          mv "$pkg" "$asset"
          gh release upload "$TAG" "$asset" --clobber --repo "$REPO"
